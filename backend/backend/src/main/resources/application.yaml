spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5433/expense_detector
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate.hibernate.generate_statistics: true

  flyway:
    enabled: true

server:
  port: 8000

app:
  jwtSecret: ${JWTSecret}
  jwtExpirationMs: 600000
  jwtCookieName: expense
  refreshExpirationMs: 86400000

logging:
  level:
    org:
      hibernate:
        tool:
          schema: DEBUG
        SQL: DEBUG
        stat: DEBUG


